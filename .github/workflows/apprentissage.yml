# Mémoire d'apprentissage de l'agent : étudie les erreurs et réussites des jours déjà jugés et enregistre les leçons
# (table memoire_agent), relues par l'agent à chaque run. Lancé aussi automatiquement après chaque vérification des résultats.
name: Apprentissage de l'agent

on:
  workflow_dispatch:
    inputs:
      jours:
        description: "Nombre de jours récents à étudier (défaut 14)"
        required: false
        default: "14"
        type: string
      refaire:
        description: "Recalculer et remplacer les études déjà enregistrées"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  apprendre:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"  # journaux affichés en direct (sinon visibles seulement à la fin)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_QUOTA_PAR_MINUTE: ${{ secrets.API_FOOTBALL_QUOTA_PAR_MINUTE }}
      STATS_DETAILLEES_ACTIVE: ${{ secrets.STATS_DETAILLEES_ACTIVE }}
      SAISON_MAX_PLAN_GRATUIT: ${{ secrets.SAISON_MAX_PLAN_GRATUIT }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Agent IA de planification des vérifications (plan_verification) — repli sur un plan déterministe sans clé
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODELES: ${{ vars.DEEPSEEK_MODELES }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODELES: ${{ vars.OPENROUTER_MODELES }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODELES: ${{ vars.GROQ_MODELES }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODELES: ${{ vars.GEMINI_MODELES }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            bet_agent/requirements.txt

      - run: pip install -r backend/requirements.txt -r bet_agent/requirements.txt

      - name: Étudier les erreurs
        working-directory: backend
        env:
          JOURS: ${{ inputs.jours }}
          REFAIRE: ${{ inputs.refaire }}
        run: |
          if [ "$REFAIRE" = "true" ]; then
            python -m app.taches apprendre --jours "${JOURS:-14}" --refaire
          else
            python -m app.taches apprendre --jours "${JOURS:-14}"
          fi

      - name: Rapport du suivi en ombre
        working-directory: backend
        run: python -m app.taches rapport-ombre --jours 30
