# Vérifie l'API privée en ligne (Edge Function Supabase "api") route par route, avec le jeton
# rangé dans le Vault Supabase. À la main, et chaque lundi.
name: Tester l'API

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

jobs:
  tester:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            bet_agent/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Tester chaque route
        working-directory: backend
        run: python -m app.taches tester-api
