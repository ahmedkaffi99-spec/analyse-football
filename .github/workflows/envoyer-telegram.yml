# Envoie sur Telegram les coupons DÉJÀ calculés d'un run (sans nouvelle collecte ni IA),
# par exemple après un essai du pipeline lancé sans Telegram.
name: Envoyer sur Telegram

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Numéro du run (vide = dernier run terminé)"
        required: false
        default: ""
      forcer:
        description: "Renvoyer même si déjà envoyé"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  envoyer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_ID: ${{ inputs.run_id }}
      FORCER: ${{ inputs.forcer }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            bet_agent/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Envoyer les coupons
        working-directory: backend
        run: |
          ARGS="envoyer"
          if [ -n "$RUN_ID" ]; then
            case "$RUN_ID" in
              *[!0-9]*) echo "::error::run_id doit être un nombre"; exit 1 ;;
            esac
            ARGS="$ARGS --run-id $RUN_ID"
          fi
          if [ "$FORCER" = "true" ]; then ARGS="$ARGS --forcer"; fi
          python -m app.taches $ARGS
