# Test isolé et rapide de ClubElo/Understat (pas de collecte complète) — pour vérifier un
# correctif sans attendre 10+ minutes de run complet à chaque fois.
name: Tester ClubElo/Understat

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tester:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bet_agent/requirements.txt
      - run: pip install -r bet_agent/requirements.txt
      - working-directory: bet_agent
        run: python verifier_elo_understat.py
