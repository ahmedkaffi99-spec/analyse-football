# Diagnostics groupés (consolidation du 30/09/2026, demande explicite : nettoyer les workflows
# inutiles et regrouper le reste en quelques essentiels) — remplace 4 workflows séparés
# (Tester les IA, Tester stats détaillées API-Football, Vérifier l'état de la collecte,
# Modèles gratuits OpenRouter) par un seul, à choix. Aucune de ces vérifications ne collecte de
# vrais coupons ni n'appelle DeepSeek pour composer un ticket — diagnostic seulement.
name: Diagnostics

on:
  workflow_dispatch:
    inputs:
      verification:
        description: "Quel diagnostic lancer ?"
        type: choice
        options:
          - marches-disponibles
          - matchs-5-grands-championnats
          - api-football-stats-detaillees
          - ia
          - modeles-openrouter-gratuits
          - cotes-match
          - backtest-k-buts
        default: marches-disponibles
      date_debut:
        description: "Date cible de début (AAAA-MM-JJ) — utilisé seulement par 'marches-disponibles'"
        type: string
        default: ""
      date_fin:
        description: "Date cible de fin (AAAA-MM-JJ) — utilisé seulement par 'marches-disponibles'"
        type: string
        default: ""
      match_recherche:
        description: "'cotes-match' uniquement : fragments séparés par une virgule, TOUS requis (ex: \"Newcastle,Aston Villa\") — un seul fragment risque de matcher une équipe réserve/féminine homonyme"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_QUOTA_PAR_MINUTE: ${{ secrets.API_FOOTBALL_QUOTA_PAR_MINUTE }}
      STATS_DETAILLEES_ACTIVE: ${{ secrets.STATS_DETAILLEES_ACTIVE }}
      SAISON_MAX_PLAN_GRATUIT: ${{ secrets.SAISON_MAX_PLAN_GRATUIT }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DATE_CIBLE_DEBUT: ${{ inputs.date_debut }}
      DATE_CIBLE_FIN: ${{ inputs.date_fin }}
      MATCH_RECHERCHE: ${{ inputs.match_recherche }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            bet_agent/requirements.txt
      - run: pip install -r backend/requirements.txt -r bet_agent/requirements.txt

      - name: Marchés 1xBet actuellement disponibles
        if: inputs.verification == 'marches-disponibles'
        working-directory: bet_agent
        run: python -c "import collecte_donnees; collecte_donnees.collecter_donnees()"

      - name: Matchs du jour dans les 5 grands championnats (API-Football, lecture seule)
        # Court-circuite la sélection manuelle (toujours active aujourd'hui, voir MATCHS_
        # MANUELS_DATES) pour compter précisément ce que l'automatique aurait réellement
        # trouvé — aucune collecte complète, aucune écriture en base, aucun envoi Telegram.
        if: inputs.verification == 'matchs-5-grands-championnats'
        working-directory: bet_agent
        run: |
          python -c "
          import collecte_donnees as cd
          fixtures = cd.recuperer_fixtures_api_football()
          matchs = cd.selectionner_matchs_du_jour_api_football(fixtures)
          print(f'\\n=== {len(matchs)} match(s) NS trouvé(s) dans les 5 grands championnats (Premier League, La Liga, Serie A, Bundesliga, Ligue 1) ===')
          print('\\n=== TOUS les fixtures bruts league_id 2 (UCL) ou 3 (UEL), tout statut confondu, jamais filtrés ===')
          for fx in fixtures:
              lid = (fx.get('league') or {}).get('id')
              if lid in (2, 3):
                  home = (fx.get('teams') or {}).get('home', {}).get('name')
                  away = (fx.get('teams') or {}).get('away', {}).get('name')
                  statut = ((fx.get('fixture') or {}).get('status') or {}).get('short')
                  date = (fx.get('fixture') or {}).get('date')
                  print(f'   • {home} vs {away} — statut={statut} — date={date} — league_id={lid}')
          "

      - name: API-Football — stats détaillées (15 métriques, 10 derniers matchs)
        if: inputs.verification == 'api-football-stats-detaillees'
        working-directory: bet_agent
        run: python verifier_stats_detaillees.py

      - name: Cotes 1xBet réelles d'un match (marchés buts uniquement, lecture seule)
        # Réutilise EXACTEMENT les fonctions de production (recuperer_fixtures_api_football,
        # recuperer_marches_pour_fixture_api_football -> adaptateur_api_football) — jamais une
        # requête HTTP dupliquée. Aucune écriture en base, aucun envoi Telegram.
        if: inputs.verification == 'cotes-match'
        working-directory: bet_agent
        run: |
          python -c "
          import os
          import collecte_donnees as cd

          # Fragments séparés par une virgule : TOUS doivent apparaître (dans le nom de
          # domicile OU d'extérieur) pour éviter de confondre avec une équipe réserve/féminine
          # portant un nom proche (ex: \"Newcastle Jets FC W\" pour une recherche \"Newcastle\" seul).
          fragments = [f.strip().lower() for f in (os.getenv('MATCH_RECHERCHE') or '').split(',') if f.strip()]
          fixtures = cd.recuperer_fixtures_api_football()
          trouve = None
          for fx in fixtures:
              home = ((fx.get('teams') or {}).get('home') or {}).get('name', '')
              away = ((fx.get('teams') or {}).get('away') or {}).get('name', '')
              texte = home.lower() + ' ' + away.lower()
              if fragments and all(f in texte for f in fragments):
                  trouve = fx
                  break
          if not trouve:
              print(f'Aucun match trouvé pour {fragments!r} parmi {len(fixtures)} fixtures.')
          else:
              home = (trouve['teams']['home'] or {}).get('name')
              away = (trouve['teams']['away'] or {}).get('name')
              fixture_id = trouve['fixture']['id']
              print(f'=== {home} vs {away} (fixture_id={fixture_id}) ===')
              marches = cd.recuperer_marches_pour_fixture_api_football(fixture_id)
              if not marches:
                  print('Aucun marché 1xbet exploitable (périmé/indisponible/quota).')
              else:
                  marches_buts = [m for m in marches if m['marche'] in (
                      'Full Time Result', 'Double Chance Full Time', 'Over Under Full Time',
                      'Over Under Team 1', 'Over Under Team 2', 'Both Teams To Score')]
                  print(f'{len(marches_buts)} marché(s) buts (sur {len(marches)} marchés 1xbet au total) :')
                  for m in sorted(marches_buts, key=lambda m: (m['marche'], m['handicap'] or 0)):
                      sels = ', '.join(f\"{s['selection']}@{s['cote']}\" for s in m['selections'])
                      print(f\"   {m['marche']:25s} ligne={m['handicap']!s:6s} {sels}\")
          "

      - name: Backtest réel — meilleur shrinkage_buts (k) sur le marché buts, 5 grands championnats
        # Réutilise EXACTEMENT moteur/backtest.py (walk-forward, aucune fuite du futur) sur les
        # vrais matchs en base (historique.charger_matchs) — jamais une estimation manuelle.
        # Isole le marché "buts_total" (Over/Under but du match) pour chaque valeur de k testée.
        # Aucune cote historique en base -> seul le Brier/log_loss est mesuré (pas de ROI), ce
        # qui suffit à comparer les k entre eux : le meilleur est celui qui prédit le mieux les
        # buts réellement marqués, pas celui qui "gagnerait le plus de paris".
        if: inputs.verification == 'backtest-k-buts'
        working-directory: backend
        run: |
          python -c "
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd().parent))  # moteur/ vit à la racine du dépôt, hors de backend/

          from datetime import datetime, timezone

          from app.database import SessionLocal
          from app.services.historique import charger_matchs
          from moteur.backtest import generer_lignes, metriques
          from moteur.config import Config

          COMPETITIONS = {39: 'Premier League', 61: 'Ligue 1', 78: 'Bundesliga', 135: 'Serie A', 140: 'La Liga'}

          with SessionLocal() as db:
              matchs = []
              for comp_id in COMPETITIONS:
                  matchs.extend(charger_matchs(db, competition_id=comp_id))

          print(f'{len(matchs)} matchs chargés (5 grands championnats, historique complet en base).')
          debut = min(m['date'] for m in matchs)
          fin = datetime.now(timezone.utc).isoformat()

          print(f'{\"k (shrinkage_buts)\":>20s} {\"n_predictions\":>14s} {\"brier\":>8s} {\"log_loss\":>10s} {\"win_rate\":>10s}')
          resultats = []
          for k in (3, 5, 8, 10, 15, 20, 30, 50):
              cfg = Config.depuis_env(shrinkage_buts=float(k))
              lignes = generer_lignes(matchs, {}, cfg, debut, fin, lignes={'buts_total': [1.5, 2.5, 3.5]})
              m = metriques(lignes, cfg, paris=False)
              resultats.append((k, m))
              print(f'{k:>20} {m[\"n_predictions\"]:>14} {m[\"brier\"] if m[\"brier\"] is not None else float(\"nan\"):>8.4f} '
                    f'{m[\"log_loss\"] if m[\"log_loss\"] is not None else float(\"nan\"):>10.4f} '
                    f'{m[\"win_rate\"] if m[\"win_rate\"] is not None else float(\"nan\"):>10.4f}')

          valides = [(k, m) for k, m in resultats if m['brier'] is not None]
          meilleur = min(valides, key=lambda km: km[1]['brier']) if valides else None
          if meilleur:
              print(f'\\n=== Meilleur k (Brier le plus bas) : k={meilleur[0]} -> Brier={meilleur[1][\"brier\"]} '
                    f'(sur {meilleur[1][\"n_predictions\"]} prédictions buts_total) ===')
          "

      - name: IA (Groq, Gemini, OpenRouter)
        if: inputs.verification == 'ia'
        working-directory: backend
        run: python -m app.taches tester-ia

      - name: Modèles gratuits OpenRouter
        if: inputs.verification == 'modeles-openrouter-gratuits'
        working-directory: backend
        run: python -m app.taches modeles-gratuits
