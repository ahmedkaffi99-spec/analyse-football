        # domicile inclus) mais bet_agent (le pipeline RÉEL qui compose les coupons) ne l'utilise
        # PAS du tout — ce diagnostic calcule le vrai Elo de ces deux équipes à la date du match
        # pour vérifier si ce signal, absent en production, capturerait l'écart de qualité que
        # la forme récente seule rate.
