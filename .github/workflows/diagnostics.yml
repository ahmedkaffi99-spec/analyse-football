# Diagnostics groupés (consolidation du 30/09/2026, demande explicite : nettoyer les workflows
# inutiles et regrouper le reste en quelques essentiels) — remplace 4 workflows séparés
# (Tester les IA, Tester stats détaillées API-Football, Vérifier l'état de la collecte,
# Modèles gratuits OpenRouter) par un seul, à choix. Aucune de ces vérifications ne collecte de
# vrais coupons ni n'appelle DeepSeek pour composer un ticket — diagnostic seulement.
name: Diagnostics

on:
  workflow_dispatch:
    inputs:
      verification:
        description: "Quel diagnostic lancer ?"
        type: choice
        options:
          - marches-disponibles
          - matchs-5-grands-championnats
          - api-football-stats-detaillees
          - ia
          - modeles-openrouter-gratuits
          - cotes-match
          - backtest-k-buts
          - backtest-k-comptage
          - backtest-k-lissage-buts
          - backtest-handicap-calibration
          - elo-real-madrid-sevilla
          - backtest-poids-elo
          - backtest-poids-arbitre-cartons
          - backtest-calibration-double-chance
          - backtest-avantage-domicile
          - backtest-calibration-non-buts
          - bets-bruts-api-football
          - catalogue-par-famille
        default: marches-disponibles
      date_debut:
        description: "Date cible de début (AAAA-MM-JJ) — utilisé seulement par 'marches-disponibles'"
        type: string
        default: ""
      date_fin:
        description: "Date cible de fin (AAAA-MM-JJ) — utilisé seulement par 'marches-disponibles'"
        type: string
        default: ""
      match_recherche:
        description: "'cotes-match' uniquement : fragments séparés par une virgule, TOUS requis (ex: \"Newcastle,Aston Villa\") — un seul fragment risque de matcher une équipe réserve/féminine homonyme"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_QUOTA_PAR_MINUTE: ${{ secrets.API_FOOTBALL_QUOTA_PAR_MINUTE }}
      STATS_DETAILLEES_ACTIVE: ${{ secrets.STATS_DETAILLEES_ACTIVE }}
      SAISON_MAX_PLAN_GRATUIT: ${{ secrets.SAISON_MAX_PLAN_GRATUIT }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DATE_CIBLE_DEBUT: ${{ inputs.date_debut }}
      DATE_CIBLE_FIN: ${{ inputs.date_fin }}
      MATCH_RECHERCHE: ${{ inputs.match_recherche }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            bet_agent/requirements.txt
      - run: pip install -r backend/requirements.txt -r bet_agent/requirements.txt

      - name: Marchés 1xBet actuellement disponibles
        if: inputs.verification == 'marches-disponibles'
        working-directory: bet_agent
        run: python -c "import collecte_donnees; collecte_donnees.collecter_donnees()"

      - name: Matchs du jour dans les 5 grands championnats (API-Football, lecture seule)
        # Court-circuite la sélection manuelle (toujours active aujourd'hui, voir MATCHS_
        # MANUELS_DATES) pour compter précisément ce que l'automatique aurait réellement
        # trouvé — aucune collecte complète, aucune écriture en base, aucun envoi Telegram.
        if: inputs.verification == 'matchs-5-grands-championnats'
        working-directory: bet_agent
        run: |
          python -c "
          import collecte_donnees as cd
          fixtures = cd.recuperer_fixtures_api_football()
          matchs = cd.selectionner_matchs_du_jour_api_football(fixtures)
          print(f'\\n=== {len(matchs)} match(s) NS trouvé(s) dans les 5 grands championnats (Premier League, La Liga, Serie A, Bundesliga, Ligue 1) ===')
          print('\\n=== TOUS les fixtures bruts league_id 2 (UCL) ou 3 (UEL), tout statut confondu, jamais filtrés ===')
          for fx in fixtures:
              lid = (fx.get('league') or {}).get('id')
              if lid in (2, 3):
                  home = (fx.get('teams') or {}).get('home', {}).get('name')
                  away = (fx.get('teams') or {}).get('away', {}).get('name')
                  statut = ((fx.get('fixture') or {}).get('status') or {}).get('short')
                  date = (fx.get('fixture') or {}).get('date')
                  print(f'   • {home} vs {away} — statut={statut} — date={date} — league_id={lid}')
          "

      - name: API-Football — stats détaillées (15 métriques, 10 derniers matchs)
        if: inputs.verification == 'api-football-stats-detaillees'
        working-directory: bet_agent
        run: python verifier_stats_detaillees.py

      - name: Cotes 1xBet réelles d'un match (marchés buts uniquement, lecture seule)
        # Réutilise EXACTEMENT les fonctions de production (recuperer_fixtures_api_football,
        # recuperer_marches_pour_fixture_api_football -> adaptateur_api_football) — jamais une
        # requête HTTP dupliquée. Aucune écriture en base, aucun envoi Telegram.
        if: inputs.verification == 'cotes-match'
        working-directory: bet_agent
        run: |
          python -c "
          import os
          import collecte_donnees as cd

          # Fragments séparés par une virgule : TOUS doivent apparaître (dans le nom de
          # domicile OU d'extérieur) pour éviter de confondre avec une équipe réserve/féminine
          # portant un nom proche (ex: \"Newcastle Jets FC W\" pour une recherche \"Newcastle\" seul).
          fragments = [f.strip().lower() for f in (os.getenv('MATCH_RECHERCHE') or '').split(',') if f.strip()]
          fixtures = cd.recuperer_fixtures_api_football()
          trouve = None
          for fx in fixtures:
              home = ((fx.get('teams') or {}).get('home') or {}).get('name', '')
              away = ((fx.get('teams') or {}).get('away') or {}).get('name', '')
              texte = home.lower() + ' ' + away.lower()
              if fragments and all(f in texte for f in fragments):
                  trouve = fx
                  break
          if not trouve:
              print(f'Aucun match trouvé pour {fragments!r} parmi {len(fixtures)} fixtures.')
          else:
              home = (trouve['teams']['home'] or {}).get('name')
              away = (trouve['teams']['away'] or {}).get('name')
              fixture_id = trouve['fixture']['id']
              print(f'=== {home} vs {away} (fixture_id={fixture_id}) ===')
              marches = cd.recuperer_marches_pour_fixture_api_football(fixture_id)
              if not marches:
                  print('Aucun marché 1xbet exploitable (périmé/indisponible/quota).')
              else:
                  marches_buts = [m for m in marches if m['marche'] in (
                      'Full Time Result', 'Double Chance Full Time', 'Over Under Full Time',
                      'Over Under Team 1', 'Over Under Team 2', 'Both Teams To Score')]
                  print(f'{len(marches_buts)} marché(s) buts (sur {len(marches)} marchés 1xbet au total) :')
                  for m in sorted(marches_buts, key=lambda m: (m['marche'], m['handicap'] or 0)):
                      sels = ', '.join(f\"{s['selection']}@{s['cote']}\" for s in m['selections'])
                      print(f\"   {m['marche']:25s} ligne={m['handicap']!s:6s} {sels}\")
          "

      - name: Backtest réel — meilleur shrinkage_buts (k) pour Newcastle vs Aston Villa (buts)
        # Réutilise EXACTEMENT moteur/backtest.py (walk-forward, aucune fuite du futur) sur les
        # vrais matchs Premier League en base (historique.charger_matchs) — jamais une estimation
        # manuelle. La Premier League ENTIÈRE doit être chargée (les moyennes de ligue de
        # buts_attendus() ont besoin des 380 derniers matchs de la compétition, voir
        # moteur/features.py:_moyennes_ligue) — seule l'ÉVALUATION finale est restreinte aux
        # matchs de Newcastle (id=34) et Aston Villa (id=66), sur buts_total + buts_equipe1/2.
        # Aucune cote historique en base -> seul le Brier/log_loss est mesuré (pas de ROI), ce
        # qui suffit à comparer les k entre eux : le meilleur est celui qui prédit le mieux les
        # buts réellement marqués par CES deux équipes, pas celui qui \"gagnerait le plus de paris\".
        if: inputs.verification == 'backtest-k-buts'
        working-directory: backend
        run: |
          python -c "
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd().parent))  # moteur/ vit à la racine du dépôt, hors de backend/

          from datetime import datetime, timezone

          from app.database import SessionLocal
          from app.services.historique import charger_matchs
          from moteur.backtest import generer_lignes, metriques
          from moteur.config import Config

          EQUIPES = {34: 'Newcastle', 66: 'Aston Villa'}

          with SessionLocal() as db:
              matchs = charger_matchs(db, competition_id=39)  # Premier League entière (requis pour les moyennes de ligue)

          print(f'{len(matchs)} matchs Premier League chargés (historique complet, requis pour les moyennes de ligue).')
          matchs_cibles = {m['match_id'] for m in matchs if m['home_id'] in EQUIPES or m['away_id'] in EQUIPES}
          print(f'{len(matchs_cibles)} matchs impliquant Newcastle ou Aston Villa -> seuls ceux-ci sont évalués.')
          debut = min(m['date'] for m in matchs)
          fin = datetime.now(timezone.utc).isoformat()
          marches_evalues = ('buts_total', 'buts_equipe1', 'buts_equipe2')

          print(f'{\"k (shrinkage_buts)\":>20s} {\"n_predictions\":>14s} {\"brier\":>8s} {\"log_loss\":>10s} {\"win_rate\":>10s}')
          resultats = []
          for k in (3, 5, 8, 10, 15, 20, 30, 50):
              cfg = Config.depuis_env(shrinkage_buts=float(k))
              # predire_match() FUSIONNE ce dict avec LIGNES_DEFAUT (tous les marchés) au lieu de
              # le remplacer -> filtre explicite après coup, sinon on recalcule inutilement
              # handicap/corners/cartons/tirs/fautes à chaque k (beaucoup plus lent).
              lignes = generer_lignes(matchs, {}, cfg, debut, fin,
                                      lignes={'buts_total': [1.5, 2.5, 3.5], 'buts_equipe1': [0.5, 1.5], 'buts_equipe2': [0.5, 1.5]})
              lignes_cibles = [ln for ln in lignes if ln.marche in marches_evalues and ln.match_id in matchs_cibles]
              m = metriques(lignes_cibles, cfg, paris=False)
              resultats.append((k, m))
              print(f'{k:>20} {m[\"n_predictions\"]:>14} {m[\"brier\"] if m[\"brier\"] is not None else float(\"nan\"):>8.4f} '
                    f'{m[\"log_loss\"] if m[\"log_loss\"] is not None else float(\"nan\"):>10.4f} '
                    f'{m[\"win_rate\"] if m[\"win_rate\"] is not None else float(\"nan\"):>10.4f}')

          valides = [(k, m) for k, m in resultats if m['brier'] is not None]
          meilleur = min(valides, key=lambda km: km[1]['brier']) if valides else None
          if meilleur:
              print(f'\\n=== Meilleur k (Brier le plus bas) : k={meilleur[0]} -> Brier={meilleur[1][\"brier\"]} '
                    f'(sur {meilleur[1][\"n_predictions\"]} prédictions buts_total) ===')
          "

      - name: Backtest réel — meilleur shrinkage_comptage (k) par marché, INDÉPENDANT
        # Demande explicite : "tous calcul apart indépendant ne calcul pas ensemble les tir
        # corner et jaune etc" puis "fait les backtest avec un seule match real betis vs
        # barcelona" — 17/10/2026, résultat de ce backtest : corners/tirs/tirs_cadres/fautes
        # préfèrent un k BIEN PLUS BAS que l'ancien défaut partagé (5.0), cartons un k plus haut
        # -> Config a désormais un champ shrinkage_comptage_<famille> PAR FAMILLE (plus un seul
        # champ partagé, voir moteur/config.py). Hors-jeux exclu : aucune donnée réelle (0 match
        # sur 1249, voir moteur/modeles/registre.py). La Liga ENTIÈRE reste chargée (moyennes de
        # ligue requises, voir moteur/features.py:_moyennes_ligue) — seule l'ÉVALUATION finale
        # est restreinte aux matchs Real Betis (id=543) / Barcelona (id=529). Pour chaque
        # (famille, k) testé, un seul champ Config change à la fois — jamais les 5 familles
        # testées avec la même valeur comme avant ce correctif.
        if: inputs.verification == 'backtest-k-comptage'
        working-directory: backend
        run: |
          python -c "
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd().parent))

          from datetime import datetime, timezone

          from app.database import SessionLocal
          from app.services.historique import charger_matchs
          from moteur.backtest import generer_lignes, metriques
          from moteur.config import Config

          FAMILLES = {
              'corners': ('corners_total', 'corners_equipe1', 'corners_equipe2'),
              'cartons': ('cartons_total', 'cartons_equipe1', 'cartons_equipe2'),
              'tirs': ('tirs_total', 'tirs_equipe1', 'tirs_equipe2'),
              'tirs_cadres': ('tirs_cadres_total', 'tirs_cadres_equipe1', 'tirs_cadres_equipe2'),
              'fautes': ('fautes_total', 'fautes_equipe1', 'fautes_equipe2'),
          }
          EQUIPES = {543: 'Real Betis', 529: 'Barcelona'}

          with SessionLocal() as db:
              matchs = charger_matchs(db, competition_id=140)  # La Liga entière (requis pour les moyennes de ligue)

          print(f'{len(matchs)} matchs La Liga chargés (historique complet, requis pour les moyennes de ligue).')
          matchs_cibles = {m['match_id'] for m in matchs if m['home_id'] in EQUIPES or m['away_id'] in EQUIPES}
          print(f'{len(matchs_cibles)} matchs impliquant Real Betis ou Barcelona -> seuls ceux-ci sont évalués.')
          debut = min(m['date'] for m in matchs)
          fin = datetime.now(timezone.utc).isoformat()

          grille_k = (3, 5, 8, 10, 15, 20, 30)
          resultats = {famille: [] for famille in FAMILLES}
          for famille, marches_famille in FAMILLES.items():
              for k in grille_k:
                  # Un seul champ Config change par appel (shrinkage_comptage_<famille>) :
                  # les 4 autres familles restent à leur valeur par défaut déjà validée.
                  cfg = Config.depuis_env(**{f'shrinkage_comptage_{famille}': float(k)})
                  lignes = generer_lignes(matchs, {}, cfg, debut, fin)
                  lignes_f = [ln for ln in lignes if ln.marche in marches_famille and ln.match_id in matchs_cibles]
                  m = metriques(lignes_f, cfg, paris=False)
                  resultats[famille].append((k, m))

          meilleurs = {}
          for famille, mesures in resultats.items():
              print(f'\\n=== {famille} ===')
              print(f'{\"k\":>6s} {\"n_predictions\":>14s} {\"brier\":>8s} {\"log_loss\":>10s}')
              for k, m in mesures:
                  print(f'{k:>6} {m[\"n_predictions\"]:>14} {m[\"brier\"] if m[\"brier\"] is not None else float(\"nan\"):>8.4f} '
                        f'{m[\"log_loss\"] if m[\"log_loss\"] is not None else float(\"nan\"):>10.4f}')
              valides = [(k, m) for k, m in mesures if m['brier'] is not None]
              meilleur = min(valides, key=lambda km: km[1]['brier']) if valides else None
              if meilleur:
                  meilleurs[famille] = meilleur
                  print(f'   -> Meilleur k pour {famille} : k={meilleur[0]} (Brier={meilleur[1][\"brier\"]}, '
                        f'{meilleur[1][\"n_predictions\"]} prédictions)')

          print('\\n=== Résumé : meilleur k par famille, INDÉPENDANT (Real Betis vs Barcelona) ===')
          for famille, (k, m) in meilleurs.items():
              print(f'   {famille:12s} k={k:>3} (Brier={m[\"brier\"]})')
          "

      - name: Backtest réel — meilleur K_LISSAGE_BUTS pour bet_agent (Handicap + BTTS)
        # Demande explicite, après investigation Handicap (43%) et BTTS (44% de réussite réelle
        # sur les jambes déjà tranchées, voir hist_matchs) : ces deux marchés utilisent le xG de
        # bet_agent (calculer_xg_depuis_stats_detaillees -> _lisser_vers_prior), COMPLÈTEMENT
        # séparé de moteur/config.py (déjà backtesté). L'ancien lissage à ratio plafonné
        # saturait à 100% de confiance dès 10 matchs — la quasi-totalité des cas réels, donc
        # AUCUN lissage en pratique. Corrigé en lissage additif (K_LISSAGE_BUTS, 17/10/2026) —
        # ce backtest calcule les VRAIES moyennes des 10 derniers matchs (tout lieu confondu,
        # comme bet_agent les utilise) depuis hist_matchs en walk-forward (moteur.features.
        # Historique, aucune fuite du futur), appelle ae.calculer_xg_depuis_stats_detaillees +
        # ae.proba_btts/proba_handicap_couvert RÉELLEMENT (jamais réimplémentées), et juge
        # chaque prédiction avec vr.juger_btts/juger_handicap (déjà utilisées en production).
        if: inputs.verification == 'backtest-k-lissage-buts'
        working-directory: backend
        run: |
          python -c "
          import sys
          from pathlib import Path
          RACINE = Path.cwd().parent
          sys.path.insert(0, str(RACINE))
          sys.path.insert(0, str(RACINE / 'bet_agent'))

          from app.database import SessionLocal
          from app.services.historique import charger_matchs
          from moteur.features import Historique, en_datetime, est_termine
          from moteur import calibration as calib

          import analyser_et_envoyer as ae
          import verifier_resultats as vr

          with SessionLocal() as db:
              matchs = charger_matchs(db, competition_id=39)

          print(f'{len(matchs)} matchs Premier League chargés.')
          hist = Historique(matchs)
          termines = sorted((m for m in matchs if est_termine(m)), key=lambda m: en_datetime(m['date']))

          def stats_dix_derniers(equipe_id, t):
              vues = hist.equipe_avant(equipe_id, t, n=10)
              if len(vues) < 5:
                  return None
              buts_pour = [v['buts_pour'] for v in vues]
              buts_contre = [v['buts_contre'] for v in vues]
              return {'buts_marques_moyenne': sum(buts_pour) / len(buts_pour),
                      'buts_encaisses_moyenne': sum(buts_contre) / len(buts_contre),
                      'matchs_avec_donnees': len(vues)}

          LIGNES_HANDICAP = (-1.0, -0.5, 0.0, 0.5, 1.0)
          grille_k = (0.0, 3, 5, 8, 10, 15, 20, 30)
          original_lisser = ae._lisser_vers_prior
          resultats_btts, resultats_handicap = [], []

          for k in grille_k:
              ae._lisser_vers_prior = (lambda v, n, p, _o=original_lisser, _k=k: _o(v, n, p, k=_k))
              points_btts, points_handicap = [], []
              for m in termines:
                  t = en_datetime(m['date'])
                  sd_h, sd_a = stats_dix_derniers(m['home_id'], t), stats_dix_derniers(m['away_id'], t)
                  if not sd_h or not sd_a:
                      continue
                  xg = ae.calculer_xg_depuis_stats_detaillees(sd_h, sd_a)
                  if not xg:
                      continue
                  mu_h, mu_a = xg
                  hg, ag = m['home_score'], m['away_score']
                  p_btts = ae.proba_btts(mu_h, mu_a)
                  issue_btts = vr.juger_btts('oui', hg, ag)
                  points_btts.append((p_btts, 1 if issue_btts == 'gagne' else 0))
                  for ligne in LIGNES_HANDICAP:
                      p_hcp = ae.proba_handicap_couvert(mu_h, mu_a, ligne)
                      issue_hcp = vr.juger_handicap(ligne, '1', hg, ag)
                      if issue_hcp == 'push':
                          continue
                      points_handicap.append((p_hcp, 1 if issue_hcp == 'gagne' else 0))
              ae._lisser_vers_prior = original_lisser
              resultats_btts.append((k, len(points_btts), calib.brier(points_btts) if points_btts else None))
              resultats_handicap.append((k, len(points_handicap), calib.brier(points_handicap) if points_handicap else None))

          for nom, resultats in (('BTTS', resultats_btts), ('Handicap (5 lignes testées)', resultats_handicap)):
              print(f'\\n=== {nom} ===')
              print(f'{\"k\":>6s} {\"n_predictions\":>14s} {\"brier\":>8s}')
              for k, n, b in resultats:
                  print(f'{k:>6} {n:>14} {b if b is not None else float(\"nan\"):>8.4f}')
              valides = [(k, n, b) for k, n, b in resultats if b is not None]
              meilleur = min(valides, key=lambda kn: kn[2]) if valides else None
              if meilleur:
                  print(f'   -> Meilleur k pour {nom} : k={meilleur[0]} (Brier={meilleur[2]}, {meilleur[1]} prédictions)')
          "

      - name: Backtest réel — biais favori/outsider sur Handicap, par tranche de probabilité
        # Demande explicite, après investigation "Handicap Asiatique" (17/10/2026) : l'échantillon
        # production réel (categorie='Handicap', 48 jambes déjà tranchées) montre un calibrage TRÈS
        # inégal selon la tranche de confiance annoncée — 55-70 % (n=20) : 45 % réel pour 63,7 %
        # annoncé (18,7 pts de surconfiance) ; 70-100 % (n=20) : 75 % réel pour 77,3 % annoncé (2,3
        # pts, quasi parfait) ; <45 % (n=5, trop petit) : 0 % réel pour 32,3 % annoncé. Hypothèse à
        # vérifier sur un VRAI grand échantillon (5 grands championnats, walk-forward, k=10 déjà fixé
        # en production, voir K_LISSAGE_BUTS) plutôt que sur 48 jambes : le biais gros-favori-bien-
        # calibré / favori-moyen-surconfiant est-il structurel (modèle Poisson/Dixon-Coles) ou
        # spécifique à l'échantillon bet_agent (bruit, petit n) ? Teste aussi plusieurs lignes de
        # handicap par match (-2.5 à +2.5) pour couvrir autant les gros favoris que les outsiders.
        if: inputs.verification == 'backtest-handicap-calibration'
        working-directory: backend
        run: |
          python -c "
          import sys
          from pathlib import Path
          RACINE = Path.cwd().parent
          sys.path.insert(0, str(RACINE))
          sys.path.insert(0, str(RACINE / 'bet_agent'))

          from app.database import SessionLocal
          from app.services.historique import charger_matchs
          from moteur.features import Historique, en_datetime, est_termine
          from moteur import calibration as calib

          import analyser_et_envoyer as ae
          import verifier_resultats as vr

          COMPETITIONS = {39: 'Premier League', 140: 'La Liga', 135: 'Serie A', 78: 'Bundesliga', 61: 'Ligue 1'}
          LIGNES_HANDICAP = (-2.5, -2.0, -1.5, -1.0, -0.5, 0.0, 0.5, 1.0, 1.5, 2.0, 2.5)

          def stats_dix_derniers(hist, equipe_id, t):
              vues = hist.equipe_avant(equipe_id, t, n=10)
              if len(vues) < 5:
                  return None
              buts_pour = [v['buts_pour'] for v in vues]
              buts_contre = [v['buts_contre'] for v in vues]
              return {'buts_marques_moyenne': sum(buts_pour) / len(buts_pour),
                      'buts_encaisses_moyenne': sum(buts_contre) / len(buts_contre),
                      'matchs_avec_donnees': len(vues)}

          points = []  # (proba, issue 0/1, ligne, favori_bool)
          with SessionLocal() as db:
              for comp_id, nom in COMPETITIONS.items():
                  matchs = charger_matchs(db, competition_id=comp_id)
                  print(f'{len(matchs)} matchs {nom} chargés.')
                  hist = Historique(matchs)
                  termines = sorted((m for m in matchs if est_termine(m)), key=lambda m: en_datetime(m['date']))
                  for m in termines:
                      t = en_datetime(m['date'])
                      sd_h, sd_a = stats_dix_derniers(hist, m['home_id'], t), stats_dix_derniers(hist, m['away_id'], t)
                      if not sd_h or not sd_a:
                          continue
                      xg = ae.calculer_xg_depuis_stats_detaillees(sd_h, sd_a)
                      if not xg:
                          continue
                      mu_h, mu_a = xg
                      hg, ag = m['home_score'], m['away_score']
                      for ligne in LIGNES_HANDICAP:
                          p_hcp = ae.proba_handicap_couvert(mu_h, mu_a, ligne)
                          issue_hcp = vr.juger_handicap(ligne, '1', hg, ag)
                          if issue_hcp == 'push':
                              continue
                          points.append((p_hcp, 1 if issue_hcp == 'gagne' else 0, ligne))

          print(f'\\n{len(points)} prédictions handicap (domicile, 11 lignes x 5 championnats).')
          seul_proba = [(p, y) for p, y, _ in points]
          print('\\n=== Calibration par tranche de probabilité annoncée (biais favori/outsider) ===')
          for ligne_cal in calib.tableau_fiabilite(seul_proba):
              print(f'   {ligne_cal[\"tranche\"]:>8s} : n={ligne_cal[\"n\"]:>5} proba_moyenne={ligne_cal[\"proba_moyenne\"]:.3f} '
                    f'frequence_reelle={ligne_cal[\"frequence_reelle\"]:.3f} ecart={ligne_cal[\"ecart\"]:+.3f}')
          print(f'   Brier global : {calib.brier(seul_proba):.4f}')

          print('\\n=== Calibration par ampleur de la ligne de handicap (famille) ===')
          FAMILLES_LIGNE = {'grosse ligne (|l|>=2)': lambda l: abs(l) >= 2.0,
                             'ligne moyenne (1<=|l|<2)': lambda l: 1.0 <= abs(l) < 2.0,
                             'petite ligne (|l|<1)': lambda l: abs(l) < 1.0}
          for nom_f, cond in FAMILLES_LIGNE.items():
              pts_f = [(p, y) for p, y, l in points if cond(l)]
              if not pts_f:
                  continue
              moy_proba = sum(p for p, _ in pts_f) / len(pts_f)
              moy_reel = sum(y for _, y in pts_f) / len(pts_f)
              print(f'   {nom_f:28s} : n={len(pts_f):>5} proba_moyenne={moy_proba:.3f} frequence_reelle={moy_reel:.3f} '
                    f'ecart={moy_reel - moy_proba:+.3f} brier={calib.brier(pts_f):.4f}')
          "

