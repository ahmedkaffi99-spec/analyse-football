name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements.txt
            bet_agent/requirements.txt

      - run: pip install -r backend/requirements-dev.txt scikit-learn

      - name: Tests du moteur d'analyse
        run: python -m pytest moteur -q

      - name: Tests du moteur central (shadow)
        run: python -m pytest moteur_central -q

      - name: Tests du pipeline
        # Audit du 11/10/2026 : "python -m unittest" ne listait que 4 des 11 fichiers
        # test_*.py de bet_agent/ (ex. test_poids_marche_override.py n'avait jamais tourné en
        # CI) — pytest découvre et exécute TOUS les fichiers du dossier, aucun oubli possible.
        run: python -m pytest bet_agent -q

      - name: Tests du backend
        run: python -m pytest backend/tests -q

      - name: Tests des scripts d'audit historique
        # Même audit : ces tests (tests/) n'étaient jamais exécutés par la CI.
        run: python -m pytest tests -q
