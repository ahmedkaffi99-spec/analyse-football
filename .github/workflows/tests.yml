name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements.txt
            bet_agent/requirements.txt

      - run: pip install -r backend/requirements-dev.txt scikit-learn

      - name: Tests du moteur d'analyse
        run: python -m pytest moteur -q

      - name: Tests du pipeline
        working-directory: bet_agent
        run: python -m unittest test_correctifs test_agent_strategie test_agent_pilote test_verifier_resultats -v

      - name: Tests du backend
        working-directory: backend
        run: python -m pytest -q
