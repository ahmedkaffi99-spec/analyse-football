# Test isolé et rapide d'API-Football /fixtures/statistics (15 métriques, 10 derniers matchs)
# — pour vérifier l'état réel du compte (quota, plan, suspension) sans attendre 10+ minutes de
# run complet ni activer STATS_DETAILLEES_ACTIVE en production.
name: Tester stats détaillées API-Football

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tester:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUNBUFFERED: "1"
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_QUOTA_PAR_MINUTE: ${{ vars.API_FOOTBALL_QUOTA_PAR_MINUTE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bet_agent/requirements.txt
      - run: pip install -r bet_agent/requirements.txt
      - working-directory: bet_agent
        run: python verifier_stats_detaillees.py
