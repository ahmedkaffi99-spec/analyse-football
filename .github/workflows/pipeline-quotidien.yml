# Remplace le cron Termux de midi (orchestrateur.py + relancer_si_echec.py).
# Les coupons sont enregistrés dans la base Supabase (secret DATABASE_URL) et envoyés sur Telegram.
name: Pipeline quotidien

on:
  schedule:
    # GitHub saute souvent les crons placés pile sur l'heure (aucun passage le 2026-09-26) :
    # minutes décalées + passages de secours. Chaque passage ne fait rien si les coupons du
    # jour sont déjà partis sur Telegram ou si un run est en cours.
    - cron: "7 10 * * *"   # ~10h07 UTC = 12h07 heure de Paris l'été (11h07 l'hiver)
    - cron: "37 10 * * *"
    - cron: "7 11 * * *"
    - cron: "37 11 * * *"
  workflow_dispatch:
    inputs:
      telegram:
        description: "Envoyer les coupons sur Telegram"
        type: boolean
        default: false
      depuis_run:
        description: "Reprendre la collecte d'un run du jour (numéro) : analyse + IA seulement"
        type: string
        default: ""
      date_debut:
        description: "Date cible de début (AAAA-MM-JJ) — vide = aujourd'hui"
        type: string
        default: ""
      date_fin:
        description: "Date cible de fin (AAAA-MM-JJ) — vide = aujourd'hui+2j"
        type: string
        default: ""

concurrency:
  group: pipeline-quotidien
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"  # journaux affichés en direct (sinon visibles seulement à la fin)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODELES: ${{ vars.DEEPSEEK_MODELES }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODELES: ${{ vars.OPENROUTER_MODELES }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODELES: ${{ vars.GROQ_MODELES }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODELES: ${{ vars.GEMINI_MODELES }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EVENEMENT: ${{ github.event_name }}
      TELEGRAM_MANUEL: ${{ inputs.telegram }}
      DEPUIS_RUN: ${{ inputs.depuis_run }}
      DATE_CIBLE_DEBUT: ${{ inputs.date_debut }}
      DATE_CIBLE_FIN: ${{ inputs.date_fin }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            bet_agent/requirements.txt

      - name: Vérifier la configuration
        run: |
          if [ -z "$DATABASE_URL" ] && [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Secret SUPABASE_DB_PASSWORD manquant"
            exit 1
          fi

      - run: pip install -r backend/requirements.txt

      - name: Lancer le pipeline
        working-directory: backend
        run: |
          ARGS="run"
          if [ "$EVENEMENT" = "schedule" ]; then
            ARGS="$ARGS --telegram --si-aucun-ticket-aujourdhui"
          elif [ "$TELEGRAM_MANUEL" = "true" ]; then
            ARGS="$ARGS --telegram"
          fi
          if [ -n "$DEPUIS_RUN" ]; then
            case "$DEPUIS_RUN" in
              *[!0-9]*) echo "::error::DEPUIS_RUN doit être un entier" && exit 1 ;;
            esac
            ARGS="$ARGS --depuis-run $DEPUIS_RUN"
          fi
          python -m app.taches $ARGS

      - name: Conserver la collecte brute (7 jours)
        uses: actions/upload-artifact@v4
        with:
          name: collecte-brute
          path: backend/data/brut/
          retention-days: 7

