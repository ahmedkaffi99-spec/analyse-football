# Remplace le cron Termux de midi (orchestrateur.py + relancer_si_echec.py).
# Les coupons sont enregistrés dans la base Supabase (secret DATABASE_URL) et envoyés sur Telegram.
# Moteur officiel depuis le 30/09/2026 (demande explicite) : l'agent pilote DeepSeek autonome
# (bet_agent/agent_pilote.py), fusionné ici avec la persistance Supabase — remplace
# l'ancien workflow séparé "Agent pilote DeepSeek" (aucune base, coupon jamais archivé).
name: Pipeline quotidien

on:
  # RÉACTIVÉ le 07/11/2026 (demande explicite de l'utilisateur) : pipeline-quotidien ET verification-resultats réactivés ensemble.
  # Pour suspendre à nouveau : remettre « # PAUSE » devant « schedule: » et devant « - cron: » dans les DEUX fichiers.
  schedule:
    # Réactivé le 26/10/2026 (demande explicite), avec le nouveau format de coupons (refonte, PR #85).
    # Un passage CHAQUE HEURE jusqu'à ce que les coupons du jour partent sur Telegram. Minute
    # décalée (:07, pas :00) : GitHub saute souvent les crons placés pile sur l'heure. Chaque
    # passage ne fait rien si les coupons du jour sont déjà partis ou si un run est en cours
    # (--si-aucun-ticket-aujourdhui) — un seul envoi par jour, les passages suivants sont des no-op.
    # Fiabilité renforcée (06/11/2026, « aucun jour manqué, sans dépendre d'une session ouverte ») : GitHub saute souvent
    # des crons, un passage toutes les 20 minutes de 6h à 14h UTC multiplie les chances ; chaque passage est un no-op dès
    # que les coupons du jour sont partis (garde --si-aucun-ticket-aujourdhui, y compris coupons envoyés la veille).
    - cron: "7,27,47 6-13 * * *"  # 6h07-13h47 UTC (9h07-16h47 à Djibouti)
  workflow_dispatch:
    # Formulaire (07/11/2026) : trois coupons PRUDENT / ÉQUILIBRÉ / RISQUE, l'IA choisit librement ; aucune cote totale cible ni cote par jambe imposée.
    inputs:
      telegram:
        description: "1. Envoyer les coupons sur Telegram : allumé = envoi, éteint = essai (rien n'est envoyé)"
        type: boolean
        default: false
      moteur:
        description: "2. Moteur (agent par défaut ; central et deterministe sont les anciens moteurs)"
        type: choice
        options:
          - "agent"
          - "central"
          - "deterministe"
        default: "agent"
      depuis_run:
        description: "3. Reprendre la collecte d'un run du JOUR (numéro, moteur agent compris) : aucun appel aux API sportives. Vide = nouvelle collecte"
        type: string
        default: ""
      date_debut:
        description: "4. Date de début des matchs visés (AAAA-MM-JJ) — vide = aujourd'hui"
        type: string
        default: ""
      date_fin:
        description: "4. Date de fin (AAAA-MM-JJ) — vide = aujourd'hui+2j ; pour un seul jour, même date que le début"
        type: string
        default: ""
      matchs_manuels:
        description: "5. Matchs imposés : Equipe A - Equipe B, Equipe C - Equipe D (vide = sélection automatique)"
        type: string
        default: ""
      modele:
        description: "10. Modèle qui pilote le run (DeepSeek par défaut)"
        type: choice
        options:
          - "deepseek"
          - "gpt-6.1-sol"
          - "gemini-4-argon"
          - "claude-sonnet-5.5"
        default: "deepseek"
      un_pari_par_match:
        description: "12. Un seul pari par match dans un coupon : actif (1 par match) ou desactive (jusqu'à 3 paris d'events différents par match)"
        type: choice
        options:
          - "actif"
          - "desactive"
        default: "actif"

concurrency:
  # Exécution strictement séquentielle : éviter les deadlocks Supabase et la saturation API-Football.
  # queue: max conserve jusqu'à 100 lancements manuels en attente au lieu d'annuler le précédent.
  group: pipeline-quotidien
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # activer/désactiver le workflow de vérification (il ne tourne que pendant la vie des coupons)

jobs:
  preparer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrice: ${{ steps.p.outputs.matrice }}
      moteur: ${{ steps.p.outputs.moteur }}
      telegram: ${{ steps.p.outputs.telegram }}
      vote: ${{ steps.p.outputs.vote }}
      date_debut: ${{ steps.p.outputs.date_debut }}
      date_fin: ${{ steps.p.outputs.date_fin }}
      ttl: ${{ steps.p.outputs.ttl }}
      cote_min_jambe: ${{ steps.p.outputs.cote_min_jambe }}
      cote_max_jambe: ${{ steps.p.outputs.cote_max_jambe }}
      depuis_run: ${{ steps.p.outputs.depuis_run }}
      ignorer_diversite: ${{ steps.p.outputs.ignorer_diversite }}
      profils: ${{ steps.p.outputs.profils }}
      passer: ${{ steps.g.outputs.passer }}   # « false » seulement pour un passage planifié inutile (coupons du jour déjà partis)
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          EVENEMENT: ${{ github.event_name }}
          TELEGRAM_IN: ${{ inputs.telegram }}
          MOTEUR: ${{ inputs.moteur }}
          DEPUIS_RUN: ${{ inputs.depuis_run }}
          DATE_DEBUT: ${{ inputs.date_debut }}
          DATE_FIN: ${{ inputs.date_fin }}
          MODELE: ${{ inputs.modele }}
          UN_PARI_PAR_MATCH: ${{ inputs.un_pari_par_match }}
          VOTE_VAR: ${{ vars.MODELES_VOTE }}
        run: python backend/app/preparer_formulaire.py

      # Garde légère des passages planifiés (Phase 3) : quand les coupons du jour sont déjà partis, le job `run` (installation complète
      # des dépendances, pipeline) est sauté — ~20 des 24 passages quotidiens ne coûtent plus rien. Même logique que la garde de
      # `app.taches run --si-aucun-ticket-aujourdhui`, qui reste active dans le job `run` (double protection contre les doubles envois).
      # Au moindre doute (base injoignable, erreur), la garde laisse passer. Jamais exécutée pour un lancement manuel.
      - uses: actions/setup-python@v5
        if: ${{ github.event_name == 'schedule' }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - id: g
        if: ${{ github.event_name == 'schedule' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pip install -q "sqlalchemy>=2.0" "psycopg[binary]>=3.1" python-dotenv
          python backend/app/garde.py

  run:
    needs: preparer
    if: ${{ needs.preparer.outputs.passer != 'false' }}
    name: Run (${{ matrix.etiquette }})
    strategy:
      fail-fast: false
      max-parallel: 1   # jamais en parallèle : interblocages de la base et limite de requêtes API-Football
      matrix:
        include: ${{ fromJSON(needs.preparer.outputs.matrice) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"  # journaux affichés en direct (sinon visibles seulement à la fin)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}        # active le workflow de vérification après l'envoi des coupons
      GITHUB_REPOSITORY: ${{ github.repository }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      # Abonnement API-Football renouvelé (plan Pro, confirmé par l'utilisateur le 04/11/2026) : retour à API-Football
      # pour les cotes, stats, Elo et H2H (OddsPapi n'est plus appelé). Remettre "1" si le compte expire.
      SANS_API_FOOTBALL: ""
      # Plafond d'edge et autres vetos automatiques retirés le 06/11/2026 (les cotes restent celles de 1xBet SEUL, demande du 04/11).
      PILOTE_MODELE: ${{ matrix.pilote }}
      # Phase 4 (07/11/2026, corrections contrôlées) : durée de l'agent < délai du job (60 min) pour un arrêt PROPRE avec journal et coûts ; coûts écrits
      # au fil de l'eau dans COUTS_FICHIER (relus par l'étape « Finaliser le run » même si le job est tué) ; au plus N runs payants ratés par jour pour
      # les passages planifiés ; second chat Telegram UNIQUEMENT via la variable du dépôt TELEGRAM_CHAT_IDS_SUPPLEMENTAIRES (plus de valeur par défaut codée).
      AGENT_DUREE_MAX_MIN: "45"
      COUTS_FICHIER: ${{ github.workspace }}/backend/data/couts_run.json
      MAX_ECHECS_PAYANTS_PAR_JOUR: ${{ vars.MAX_ECHECS_PAYANTS_PAR_JOUR || '2' }}
      TELEGRAM_CHAT_IDS_SUPPLEMENTAIRES: ${{ vars.TELEGRAM_CHAT_IDS_SUPPLEMENTAIRES }}
      API_FOOTBALL_QUOTA_PAR_MINUTE: ${{ secrets.API_FOOTBALL_QUOTA_PAR_MINUTE }}
      STATS_DETAILLEES_ACTIVE: ${{ secrets.STATS_DETAILLEES_ACTIVE }}
      SAISON_MAX_PLAN_GRATUIT: ${{ secrets.SAISON_MAX_PLAN_GRATUIT }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODELES: ${{ vars.DEEPSEEK_MODELES }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Suivi « en ombre » retiré le 06/11/2026 (le vote final et le mode « modèle seul » restent) ; OMBRE_BUDGET_USD plafonne leur dépense.
      # Vote final (mode standard seulement) : ces modèles composent aussi les 3 coupons, Python garde, par profil de risque, le coupon qui lui correspond le mieux. « aucun » = coupé.
      MODELES_VOTE: ${{ needs.preparer.outputs.vote }}
      OMBRE_BUDGET_USD: ${{ vars.OMBRE_BUDGET_USD || '0.6' }}
      # Plafond de dépenses IA PAR JOUR (Phase 3) : variable du dépôt BUDGET_JOUR_USD (défaut 3 $) ; « aucun » = sans plafond, 0 = aucune dépense payante.
      # Partagé entre tous les runs du jour (mesuré dans runs.detail) ; vote réduit ou annulé si le restant est insuffisant, jamais en silence.
      BUDGET_JOUR_USD: ${{ vars.BUDGET_JOUR_USD || '3' }}
      BUDGET_ALERTE_PCT: ${{ vars.BUDGET_ALERTE_PCT || '80' }}   # alerte Telegram quand cette part du budget du jour (UTC) est consommée, puis à l'épuisement
      OPENROUTER_MODELES: ${{ vars.OPENROUTER_MODELES }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODELES: ${{ vars.GROQ_MODELES }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODELES: ${{ vars.GEMINI_MODELES }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EVENEMENT: ${{ github.event_name }}
      TELEGRAM_MANUEL: ${{ needs.preparer.outputs.telegram }}
      MOTEUR: ${{ needs.preparer.outputs.moteur }}
      DEPUIS_RUN: ${{ needs.preparer.outputs.depuis_run }}
      IGNORER_DIVERSITE_CROISEE: ${{ needs.preparer.outputs.ignorer_diversite }}
      DATE_CIBLE_DEBUT: ${{ needs.preparer.outputs.date_debut }}
      DATE_CIBLE_FIN: ${{ needs.preparer.outputs.date_fin }}
      MATCHS_MANUELS: ${{ inputs.matchs_manuels }}
      # TROIS PROFILS DE RISQUE (demande du 07/11/2026) : prudent, équilibré, risque ; l'IA choisit librement les paris, sans cote cible.
      PROFILS_JSON: ${{ needs.preparer.outputs.profils }}   # généré par backend/app/preparer_formulaire.py (smart par défaut)
      TTL_COTES_API_FOOTBALL_SECONDES: ${{ needs.preparer.outputs.ttl }}
      COTE_MIN_JAMBE: ${{ needs.preparer.outputs.cote_min_jambe }}
      COTE_MAX_JAMBE: ${{ needs.preparer.outputs.cote_max_jambe }}
      SEUIL_PROBA_MIN: "0"   # plus de probabilité minimale par jambe ni de seuil du catalogue (retirés le 06/11/2026)
      # Comparaison parallèle bet_agent/moteur + capture hist_cotes + moteur central (shadow) :
      # jamais utilisées pour la sélection ni Telegram (voir runs.py) — vars du dépôt, vides par
      # défaut tant que l'utilisateur ne les active pas explicitement (Settings > Variables).
      MOTEUR_COMPARAISON_ACTIVE: ${{ vars.MOTEUR_COMPARAISON_ACTIVE }}
      MOTEUR_CENTRAL_SHADOW: ${{ vars.MOTEUR_CENTRAL_SHADOW }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            bet_agent/requirements.txt

      - name: Vérifier la configuration
        run: |
          if [ -z "$DATABASE_URL" ] && [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Secret SUPABASE_DB_PASSWORD manquant"
            exit 1
          fi

      - run: pip install -r backend/requirements.txt

      - name: Lancer le pipeline
        working-directory: backend
        run: |
          ARGS="run"
          if [ "$EVENEMENT" = "schedule" ]; then
            ARGS="$ARGS --telegram --si-aucun-ticket-aujourdhui"
          elif [ "$TELEGRAM_MANUEL" = "true" ]; then
            ARGS="$ARGS --telegram"
          fi
          if [ -n "$MOTEUR" ]; then
            ARGS="$ARGS --moteur $MOTEUR"
          fi
          if [ -n "$DEPUIS_RUN" ]; then
            case "$DEPUIS_RUN" in
              *[!0-9]*) echo "::error::DEPUIS_RUN doit être un entier" && exit 1 ;;
            esac
            ARGS="$ARGS --depuis-run $DEPUIS_RUN"
          fi
          if [ "$IGNORER_DIVERSITE_CROISEE" = "true" ]; then
            ARGS="$ARGS --ignorer-diversite-croisee"
          fi
          if [ -n "$PROFILS_JSON" ]; then
            python -m app.taches $ARGS --profils-json "$PROFILS_JSON"
          else
            python -m app.taches $ARGS
          fi

      - name: Finaliser le run (coûts conservés)
        # Toujours exécutée (même après un délai dépassé ou une annulation) : un run resté « en_cours » devient « interrompu » avec la dépense déjà faite.
        # N'envoie rien, n'appelle aucune API payante, ne change jamais le résultat du job.
        if: ${{ always() }}
        working-directory: backend
        run: python -m app.taches finaliser

      - name: Alerte Telegram si le pipeline a planté
        # Filet de sécurité : plantage avant/pendant le pipeline (dépendances, base, délai dépassé...). Pas de doublon si app.taches a déjà alerté.
        if: ${{ failure() && (env.EVENEMENT == 'schedule' || env.TELEGRAM_MANUEL == 'true') }}
        run: |
          # cron : seulement au dernier passage de la fenêtre (13h27 UTC), les précédents réessaient seuls (évite jusqu'à 24 alertes)
          if [ "$EVENEMENT" = "schedule" ] && [ "$(date -u +%H%M)" -lt 1320 ]; then exit 0; fi
          if [ -f backend/data/alerte_envoyee.flag ] || [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          curl -sS --max-time 20 "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ Pipeline du jour : le workflow a échoué avant d'envoyer les coupons. Vérifiez GitHub Actions (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})." \
            > /dev/null || true

      - name: Conserver la collecte brute (7 jours)
        uses: actions/upload-artifact@v4
        with:
          name: collecte-brute-${{ strategy.job-index }}
          path: backend/data/brut/
          retention-days: 7

