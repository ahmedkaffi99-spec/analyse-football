# Remplace le cron Termux de midi (orchestrateur.py + relancer_si_echec.py).
# Les coupons sont enregistrés dans la base Supabase (secret DATABASE_URL) et envoyés sur Telegram.
name: Pipeline quotidien

on:
  schedule:
    - cron: "0 10 * * *"   # 10h00 UTC = 12h00 heure de Paris l'été (11h00 l'hiver)
    - cron: "30 11 * * *"  # passage de secours : relance seulement si aucun ticket aujourd'hui
  workflow_dispatch:
    inputs:
      telegram:
        description: "Envoyer les coupons sur Telegram"
        type: boolean
        default: false

concurrency:
  group: pipeline-quotidien
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EVENEMENT: ${{ github.event_name }}
      PLANIFICATION: ${{ github.event.schedule }}
      TELEGRAM_MANUEL: ${{ inputs.telegram }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            bet_agent/requirements.txt

      - name: Vérifier la configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL manquant — sans lui, les coupons seraient perdus à la fin du job."
            exit 1
          fi

      - run: pip install -r backend/requirements.txt

      - name: Lancer le pipeline
        working-directory: backend
        run: |
          ARGS="run"
          if [ "$EVENEMENT" = "schedule" ]; then
            ARGS="$ARGS --telegram"
            if [ "$PLANIFICATION" = "30 11 * * *" ]; then
              ARGS="$ARGS --si-aucun-ticket-aujourdhui"
            fi
          elif [ "$TELEGRAM_MANUEL" = "true" ]; then
            ARGS="$ARGS --telegram"
          fi
          python -m app.taches $ARGS

      - name: Conserver la collecte brute (7 jours)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collecte-${{ github.run_id }}
          path: backend/data/*.json
          retention-days: 7
          if-no-files-found: ignore
