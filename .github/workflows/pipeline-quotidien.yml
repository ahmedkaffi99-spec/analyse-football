# Remplace le cron Termux de midi (orchestrateur.py + relancer_si_echec.py).
# Les coupons sont enregistrés dans la base Supabase (secret DATABASE_URL) et envoyés sur Telegram.
# Moteur officiel depuis le 30/09/2026 (demande explicite) : l'agent pilote DeepSeek autonome
# (bet_agent/agent_pilote.py), fusionné ici avec la persistance Supabase — remplace
# l'ancien workflow séparé "Agent pilote DeepSeek" (aucune base, coupon jamais archivé).
name: Pipeline quotidien

on:
  schedule:
    # Réactivé le 26/10/2026 (demande explicite), avec le nouveau format de coupons (refonte, PR #85).
    # Un passage CHAQUE HEURE jusqu'à ce que les coupons du jour partent sur Telegram. Minute
    # décalée (:07, pas :00) : GitHub saute souvent les crons placés pile sur l'heure. Chaque
    # passage ne fait rien si les coupons du jour sont déjà partis ou si un run est en cours
    # (--si-aucun-ticket-aujourdhui) — un seul envoi par jour, les passages suivants sont des no-op.
    # Fiabilité renforcée (06/11/2026, « aucun jour manqué, sans dépendre d'une session ouverte ») : GitHub saute souvent
    # des crons, un passage toutes les 20 minutes de 6h à 14h UTC multiplie les chances ; chaque passage est un no-op dès
    # que les coupons du jour sont partis (garde --si-aucun-ticket-aujourdhui, y compris coupons envoyés la veille).
    - cron: "7,27,47 6-13 * * *"  # 6h07-13h47 UTC (9h07-16h47 à Djibouti)
  workflow_dispatch:
    inputs:
      telegram:
        description: "Envoyer les coupons sur Telegram"
        type: boolean
        default: false
      moteur:
        description: "Moteur : central (officiel depuis le 11/10/2026 — moteur_central/, arbitrage bet_agent/moteur par marché puis sélection probabilité maximale, AUCUN repli automatique en cas d'échec), deterministe (officiel du 03/10 au 11/10/2026 — Python choisit les paris, l'IA ne fait que rédiger), ou agent pilote DeepSeek autonome (choisit aussi les paris lui-même)"
        type: choice
        options:
          - central
          - deterministe
          - agent
        default: agent
      depuis_run:
        description: "Reprendre la collecte d'un run du jour (numéro) : analyse + IA seulement (moteur deterministe uniquement)"
        type: string
        default: ""
      date_debut:
        description: "Date cible de début (AAAA-MM-JJ) — vide = aujourd'hui"
        type: string
        default: ""
      date_fin:
        description: "Date cible de fin (AAAA-MM-JJ) — vide = aujourd'hui+2j"
        type: string
        default: ""
      matchs_manuels:
        description: "Matchs manuels (optionnel) : \"Equipe A - Equipe B, Equipe C - Equipe D\" — ignore la sélection automatique pour ce run"
        type: string
        default: ""
      profils_json:
        description: "Run PONCTUEL (01/10/2026) : JSON d'une liste de profils personnalisés qui remplace les 3 profils standard pour CE run (moteur agent uniquement) — vide = comportement par défaut inchangé"
        type: string
        default: ""
      nb_jambes:
        description: "Nombre de jambes du coupon pour CE run (vide = celui du profil, 5) — sélection automatique, moteur deterministe"
        type: string
        default: ""
      nb_jambes_min:
        description: "Minimum de jambes pour CE run : en dessous, aucun coupon (vide = pas de minimum)"
        type: string
        default: ""
      nb_matchs_pool:
        description: "Taille du pool de matchs pour CE run (vide = 20) — 5 = un match par championnat à tour de rôle (plan du 22/10), sélection automatique API-Football"
        type: string
        default: ""
      ttl_cotes_secondes:
        description: "Âge MAXIMUM accepté des cotes API-Football pour CE run, en secondes (vide = 21600, soit 6 h) — à relever (ex: 43200) pour un run de nuit, quand les cotes ne sont plus rafraîchies : les marchés plus vieux que ce seuil sont écartés"
        type: string
        default: ""
      seuil_proba_min:
        description: "Probabilité MINIMALE par jambe pour CE run, en % (vide = 30)"
        type: string
        default: ""
      cote_min_jambe:
        description: "Cote MINIMALE par jambe pour CE run (vide = 1.2) — par ex. 1.2"
        type: string
        default: ""
      cote_max_jambe:
        description: "Cote MAXIMALE par jambe pour CE run (vide = 1.8, 0 = sans plafond) — par ex. 2"
        type: string
        default: ""
      modeles_ombre:
        description: "Comparaison de modèles en ombre pour CE run : identifiants OpenRouter séparés par des virgules (vide = liste par défaut ; « aucun » = désactivée) — ex. un seul modèle par run pour lancer plusieurs runs en parallèle"
        type: string
        default: ""
      pilote_modele:
        description: "Modèle OpenRouter qui PILOTE le run avec la même boucle et les mêmes outils que DeepSeek (recherche web, pages, catalogue), sans repli — ex. openai/gpt-6.1-sol. Vide = DeepSeek"
        required: false
        default: ""
      compositeur_modele:
        description: "Modèle OpenRouter qui compose SEUL les coupons de CE run, à la place du pilote DeepSeek (ex. openai/gpt-6.1-sol) — vide = pilote DeepSeek habituel"
        required: false
        default: ""
      ignorer_diversite_croisee:
        description: "Run PONCTUEL : désactive la diversité de catégorie entre profils (traite chaque profil comme le premier) — l'anti-doublon exact reste actif dans tous les cas"
        type: boolean
        default: false
      central_nb_jambes_min:
        description: "Moteur central uniquement : nombre MINIMUM de jambes par coupon pour CE run (vide = défaut, 6) — relève aussi la cote totale résultante, voir central_cote_max"
        type: string
        default: ""
      central_nb_jambes_max:
        description: "Moteur central uniquement : nombre MAXIMUM de jambes par coupon pour CE run (vide = défaut, 6)"
        type: string
        default: ""
      central_cote_min:
        description: "Moteur central uniquement : cote totale minimale visée pour CE run (vide = défaut, 3.5, calibré pour 5-6 jambes) — à relever avec central_nb_jambes_min, sinon aucune combinaison ne tombera dans la cible"
        type: string
        default: ""
      central_cote_max:
        description: "Moteur central uniquement : cote totale maximale visée pour CE run (vide = défaut, 15.0, calibré pour 5-6 jambes)"
        type: string
        default: ""
      central_edge_max:
        description: "Moteur central uniquement : plafond d'edge (%) au-delà duquel un candidat est retiré du pool, suspect (vide = défaut, 20)"
        type: string
        default: ""
      central_nb_coupons:
        description: "Moteur central uniquement : force EXACTEMENT ce nombre de coupons pour CE run (vide = dynamique selon le nombre de matchs éligibles, voir nb_coupons_dynamique)"
        type: string
        default: ""
      central_marches_autorises:
        description: "Moteur central uniquement : restreint le pool aux categorie listées, séparées par une virgule (ex: \"Total,Total Équipe 1\") (vide = tous les marchés, défaut)"
        type: string
        default: ""

concurrency:
  # Un groupe par liste de modèles en ombre : des runs d'essai « un modèle par run » peuvent tourner en parallèle ; les runs normaux gardent un seul groupe
  group: pipeline-quotidien-${{ inputs.modeles_ombre || 'defaut' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # activer/désactiver le workflow de vérification (il ne tourne que pendant la vie des coupons)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"  # journaux affichés en direct (sinon visibles seulement à la fin)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}        # active le workflow de vérification après l'envoi des coupons
      GITHUB_REPOSITORY: ${{ github.repository }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      # Abonnement API-Football renouvelé (plan Pro, confirmé par l'utilisateur le 04/11/2026) : retour à API-Football
      # pour les cotes, stats, Elo et H2H (OddsPapi n'est plus appelé). Remettre "1" si le compte expire.
      SANS_API_FOOTBALL: ""
      # Plafond d'edge 6 % (décision de l'utilisateur le 06/11/2026). Mesure sur 704 jambes jugées dédoublonnées : edge < 0 -> 72,1 % de
      # réussite pour 70,6 % annoncés ; 0-3 % -> 65,3 % ; 3-6 % -> 60,7 % ; 6 % et plus -> 52,8 % pour 63,2 % annoncés (modèle trop optimiste).
      # Les cotes restent celles de 1xBet SEUL (demande du 04/11). Valeurs possibles : 3 (prudent), 20 (libre, comportement du 03/11).
      EDGE_MAX_AGENT_PCT: "6"
      COMPOSITEUR_MODELE: ${{ inputs.compositeur_modele }}
      PILOTE_MODELE: ${{ inputs.pilote_modele }}
      API_FOOTBALL_QUOTA_PAR_MINUTE: ${{ secrets.API_FOOTBALL_QUOTA_PAR_MINUTE }}
      STATS_DETAILLEES_ACTIVE: ${{ secrets.STATS_DETAILLEES_ACTIVE }}
      SAISON_MAX_PLAN_GRATUIT: ${{ secrets.SAISON_MAX_PLAN_GRATUIT }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODELES: ${{ vars.DEEPSEEK_MODELES }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Comparaison de modèles IA « en ombre » (06/11/2026) : identifiants OpenRouter séparés par des virgules (variable de dépôt
      # MODELES_OMBRE, vide = désactivée, aucune dépense). « base » = modèle actuel. Plafond par run : OMBRE_BUDGET_USD (défaut 1.5).
      # ACTIVÉE le 06/11/2026 (demande de l'utilisateur, identifiants et prix vérifiés sur OpenRouter) : le modèle actuel + Claude Sonnet 5.5
      # (2 $/10 $) + GPT-6.1 Sol (2 $/10 $) + Gemini 4 Argon (2 $/10 $ en promotion, 4 $/20 $ ensuite). Surcharge possible par la variable de
      # dépôt MODELES_OMBRE (vide = cette liste) ; pour désactiver, mettre la variable à "aucun". Plafond de dépense : 0,60 $ par modèle et par run.
      MODELES_OMBRE: ${{ inputs.modeles_ombre || vars.MODELES_OMBRE || 'base,anthropic/claude-sonnet-5.5,openai/gpt-6.1-sol,google/gemini-4-argon' }}
      OMBRE_BUDGET_USD: ${{ vars.OMBRE_BUDGET_USD || '0.6' }}
      OPENROUTER_MODELES: ${{ vars.OPENROUTER_MODELES }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODELES: ${{ vars.GROQ_MODELES }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODELES: ${{ vars.GEMINI_MODELES }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EVENEMENT: ${{ github.event_name }}
      TELEGRAM_MANUEL: ${{ inputs.telegram }}
      MOTEUR: ${{ inputs.moteur }}
      DEPUIS_RUN: ${{ inputs.depuis_run }}
      DATE_CIBLE_DEBUT: ${{ inputs.date_debut }}
      DATE_CIBLE_FIN: ${{ inputs.date_fin }}
      MATCHS_MANUELS: ${{ inputs.matchs_manuels }}
      # SMART COUPON (demande du 06/11/2026) : l'IA choisit librement ; seules contraintes = les 3 bandes de cote totale
      # (5-10, 12-18, 20-35). Un run manuel peut toujours imposer ses propres profils via l'entrée profils_json.
      PROFILS_JSON: >-
        ${{ inputs.profils_json || '[{"cle":"coupon1","nom":"🟢 SMART COUPON — cote 5 à 10","cote_min":5,"cote_max":10,"cote_totale_min":5,"cote_totale_max":10,"nb_jambes_min":1,"nb_jambes":12,"proba_min_pct":30,"proba_max_pct":100,"jambes_max_par_match":1,"match_repete_autorise":true,"max_coupons_par_match":3,"un_seul_pari_par_event":true,"consigne":"Smart coupon : tu choisis LIBREMENT les paris et le nombre de jambes les plus probables et les mieux valorisés ; seule contrainte : la cote totale doit être dans la bande de ce profil (une seule sélection par match dans un coupon)."},{"cle":"coupon2","nom":"🟠 SMART COUPON — cote 12 à 18","cote_min":12,"cote_max":18,"cote_totale_min":12,"cote_totale_max":18,"nb_jambes_min":1,"nb_jambes":12,"proba_min_pct":30,"proba_max_pct":100,"jambes_max_par_match":1,"match_repete_autorise":true,"max_coupons_par_match":3,"un_seul_pari_par_event":true,"consigne":"Smart coupon : tu choisis LIBREMENT les paris et le nombre de jambes les plus probables et les mieux valorisés ; seule contrainte : la cote totale doit être dans la bande de ce profil (une seule sélection par match dans un coupon)."},{"cle":"coupon3","nom":"🔴 SMART COUPON — cote 20 à 35","cote_min":20,"cote_max":35,"cote_totale_min":20,"cote_totale_max":35,"nb_jambes_min":1,"nb_jambes":12,"proba_min_pct":30,"proba_max_pct":100,"jambes_max_par_match":1,"match_repete_autorise":true,"max_coupons_par_match":3,"un_seul_pari_par_event":true,"consigne":"Smart coupon : tu choisis LIBREMENT les paris et le nombre de jambes les plus probables et les mieux valorisés ; seule contrainte : la cote totale doit être dans la bande de ce profil (une seule sélection par match dans un coupon)."}]' }}
      IGNORER_DIVERSITE_CROISEE: ${{ inputs.ignorer_diversite_croisee }}
      NB_JAMBES: ${{ inputs.nb_jambes }}
      NB_JAMBES_MIN: ${{ inputs.nb_jambes_min }}
      NB_MATCHS_POOL: ${{ inputs.nb_matchs_pool }}
      TTL_COTES_API_FOOTBALL_SECONDES: ${{ inputs.ttl_cotes_secondes }}
      COTE_MIN_JAMBE: ${{ inputs.cote_min_jambe || '1.01' }}   # smart coupon : pas de plancher de cote par jambe
      COTE_MAX_JAMBE: ${{ inputs.cote_max_jambe || '0' }}      # 0 = pas de plafond de cote par jambe
      SEUIL_PROBA_MIN: ${{ inputs.seuil_proba_min || '30' }}   # probabilité minimale par jambe abaissée de 70 à 30 %
      # Comparaison parallèle bet_agent/moteur + capture hist_cotes + moteur central (shadow) :
      # jamais utilisées pour la sélection ni Telegram (voir runs.py) — vars du dépôt, vides par
      # défaut tant que l'utilisateur ne les active pas explicitement (Settings > Variables).
      MOTEUR_COMPARAISON_ACTIVE: ${{ vars.MOTEUR_COMPARAISON_ACTIVE }}
      MOTEUR_CENTRAL_SHADOW: ${{ vars.MOTEUR_CENTRAL_SHADOW }}
      MOTEUR_CENTRAL_NB_JAMBES_MIN: ${{ inputs.central_nb_jambes_min }}
      MOTEUR_CENTRAL_NB_JAMBES_MAX: ${{ inputs.central_nb_jambes_max }}
      MOTEUR_CENTRAL_COTE_MIN: ${{ inputs.central_cote_min }}
      MOTEUR_CENTRAL_COTE_MAX: ${{ inputs.central_cote_max }}
      MOTEUR_CENTRAL_EDGE_MAX: ${{ inputs.central_edge_max }}
      MOTEUR_CENTRAL_NB_COUPONS: ${{ inputs.central_nb_coupons }}
      MOTEUR_CENTRAL_MARCHES_AUTORISES: ${{ inputs.central_marches_autorises }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            bet_agent/requirements.txt

      - name: Vérifier la configuration
        run: |
          if [ -z "$DATABASE_URL" ] && [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Secret SUPABASE_DB_PASSWORD manquant"
            exit 1
          fi

      - run: pip install -r backend/requirements.txt

      - name: Lancer le pipeline
        working-directory: backend
        run: |
          ARGS="run"
          if [ "$EVENEMENT" = "schedule" ]; then
            ARGS="$ARGS --telegram --si-aucun-ticket-aujourdhui"
          elif [ "$TELEGRAM_MANUEL" = "true" ]; then
            ARGS="$ARGS --telegram"
          fi
          if [ -n "$MOTEUR" ]; then
            ARGS="$ARGS --moteur $MOTEUR"
          fi
          if [ -n "$DEPUIS_RUN" ]; then
            case "$DEPUIS_RUN" in
              *[!0-9]*) echo "::error::DEPUIS_RUN doit être un entier" && exit 1 ;;
            esac
            ARGS="$ARGS --depuis-run $DEPUIS_RUN"
          fi
          if [ "$IGNORER_DIVERSITE_CROISEE" = "true" ]; then
            ARGS="$ARGS --ignorer-diversite-croisee"
          fi
          if [ -n "$PROFILS_JSON" ]; then
            python -m app.taches $ARGS --profils-json "$PROFILS_JSON"
          else
            python -m app.taches $ARGS
          fi

      - name: Conserver la collecte brute (7 jours)
        uses: actions/upload-artifact@v4
        with:
          name: collecte-brute
          path: backend/data/brut/
          retention-days: 7

