# Remplace le cron Termux du soir (verifier_resultats.py) : juge les paris dont le match est
# terminé, met à jour la base, et envoie le bilan Telegram une fois tous les coupons jugés.
name: Vérification des résultats

on:
  schedule:
    # Filet de sécurité : l'agent de planification lance une exécution manuelle à CHAQUE heure exacte prévue (23h15,
    # 23h25...) — rien n'attend. Ce cron ne sert que de rattrapage : `verifier --si-du` ne vérifie, une fois par heure,
    # que s'il reste des jambes en attente (fenêtre de vague ouverte, matchs sans heure connue ou vieux coupons).
    - cron: "*/15 12-23,0-2 * * *"
  workflow_dispatch:
    inputs:
      telegram:
        description: "Envoyer le bilan sur Telegram"
        type: boolean
        default: true
      planifier_coupons:
        description: "Agent de planification : numéros de coupons déjà envoyés (ex. 314,315,316) — établit le plan de vérification (heures exactes par vague, rapport final) et l'annonce sur Telegram, sans vérifier maintenant"
        type: string
        default: ""

concurrency:
  group: verification-resultats
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"  # journaux affichés en direct (sinon visibles seulement à la fin)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_QUOTA_PAR_MINUTE: ${{ secrets.API_FOOTBALL_QUOTA_PAR_MINUTE }}
      STATS_DETAILLEES_ACTIVE: ${{ secrets.STATS_DETAILLEES_ACTIVE }}
      SAISON_MAX_PLAN_GRATUIT: ${{ secrets.SAISON_MAX_PLAN_GRATUIT }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Agent IA de planification des vérifications (plan_verification) — repli sur un plan déterministe sans clé
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODELES: ${{ vars.DEEPSEEK_MODELES }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODELES: ${{ vars.OPENROUTER_MODELES }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODELES: ${{ vars.GROQ_MODELES }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODELES: ${{ vars.GEMINI_MODELES }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            bet_agent/requirements.txt

      - name: Vérifier la configuration
        run: |
          if [ -z "$DATABASE_URL" ] && [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Secret SUPABASE_DB_PASSWORD manquant (mot de passe de la base Supabase) — voir DEPLOIEMENT.md."
            exit 1
          fi

      - run: pip install -r backend/requirements.txt -r bet_agent/requirements.txt

      - name: Juger les paris et envoyer le bilan
        working-directory: backend
        env:
          TELEGRAM_MANUEL: ${{ inputs.telegram }}
          EVENEMENT: ${{ github.event_name }}
          PLANIFIER_COUPONS: ${{ inputs.planifier_coupons }}
        run: |
          if [ -n "$PLANIFIER_COUPONS" ]; then
            python -m app.taches planifier-verification --coupons "$PLANIFIER_COUPONS" --telegram
          elif [ "$EVENEMENT" = "schedule" ]; then
            python -m app.taches verifier --si-du --telegram
          elif [ "$TELEGRAM_MANUEL" = "false" ]; then
            python -m app.taches verifier
          else
            python -m app.taches verifier --telegram
          fi
