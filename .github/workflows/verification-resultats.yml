# Remplace le cron Termux du soir (verifier_resultats.py) : juge les paris dont le match est
# terminé, met à jour la base, et envoie le bilan Telegram une fois tous les coupons jugés.
name: Vérification des résultats

on:
  schedule:
    # Passage toutes les 15 min de 12h à 3h UTC : le code (verifier --si-du) ne vérifie QUE si un match est arrivé à
    # l'heure de sa vérification (coup d'envoi + 90 min, ex. 21h45 -> 23h15) puis à chaque passage jusqu'à 4 h
    # après le coup d'envoi ; sinon il sort en quelques secondes, sans toucher au schéma ni à l'API.
    # Une fois par heure, rattrapage des jambes sans coup d'envoi connu (coupons enregistrés pendant une panne).
    - cron: "*/15 12-23,0-2 * * *"
  workflow_dispatch:
    inputs:
      telegram:
        description: "Envoyer le bilan sur Telegram"
        type: boolean
        default: true

concurrency:
  group: verification-resultats
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"  # journaux affichés en direct (sinon visibles seulement à la fin)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_QUOTA_PAR_MINUTE: ${{ secrets.API_FOOTBALL_QUOTA_PAR_MINUTE }}
      STATS_DETAILLEES_ACTIVE: ${{ secrets.STATS_DETAILLEES_ACTIVE }}
      SAISON_MAX_PLAN_GRATUIT: ${{ secrets.SAISON_MAX_PLAN_GRATUIT }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            bet_agent/requirements.txt

      - name: Vérifier la configuration
        run: |
          if [ -z "$DATABASE_URL" ] && [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Secret SUPABASE_DB_PASSWORD manquant (mot de passe de la base Supabase) — voir DEPLOIEMENT.md."
            exit 1
          fi

      - run: pip install -r backend/requirements.txt

      - name: Juger les paris et envoyer le bilan
        working-directory: backend
        env:
          TELEGRAM_MANUEL: ${{ inputs.telegram }}
          EVENEMENT: ${{ github.event_name }}
        run: |
          if [ "$EVENEMENT" = "schedule" ]; then
            python -m app.taches verifier --si-du --telegram
          elif [ "$TELEGRAM_MANUEL" = "false" ]; then
            python -m app.taches verifier
          else
            python -m app.taches verifier --telegram
          fi
