# Remplace le cron Termux du soir (verifier_resultats.py) : juge les paris dont le match est
# terminé, met à jour la base, et envoie le bilan Telegram une fois tous les coupons jugés.
name: Vérification des résultats

on:
  schedule:
    - cron: "0 15-23 * * *"  # toutes les heures de 15h à 23h UTC
  workflow_dispatch:

concurrency:
  group: verification-resultats
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            bet_agent/requirements.txt

      - name: Vérifier la configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL manquant."
            exit 1
          fi

      - run: pip install -r backend/requirements.txt

      - name: Juger les paris et envoyer le bilan
        working-directory: backend
        run: python -m app.taches verifier --telegram
