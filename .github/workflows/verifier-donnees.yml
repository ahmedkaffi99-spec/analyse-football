# Vérifie combien de matchs (sélection manuelle ou automatique) ont VRAIMENT des marchés
# 1xBet ouverts en ce moment — sans appeler DeepSeek, pour savoir si un run complet vaut la
# peine (le profil exige au moins 10 matchs avec marchés) sans gaspiller de tokens/quota.
name: Vérifier l'état de la collecte

on:
  workflow_dispatch:
    inputs:
      date_debut:
        description: "Date cible de début (AAAA-MM-JJ) — vide = aujourd'hui"
        type: string
        default: ""
      date_fin:
        description: "Date cible de fin (AAAA-MM-JJ) — vide = aujourd'hui+2j"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_QUOTA_PAR_MINUTE: ${{ vars.API_FOOTBALL_QUOTA_PAR_MINUTE }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      DATE_CIBLE_DEBUT: ${{ inputs.date_debut }}
      DATE_CIBLE_FIN: ${{ inputs.date_fin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bet_agent/requirements.txt
      - run: pip install -r bet_agent/requirements.txt
      - working-directory: bet_agent
        run: python -c "import collecte_donnees; collecte_donnees.collecter_donnees()"
